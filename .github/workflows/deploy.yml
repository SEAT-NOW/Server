name: Seatnow CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v3

      - name: JDK 21 환경 설정
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'corretto'

      # ⭐️ 추가된 부분: 빌드 전 application-secret.yml 생성
      - name: application-secret.yml 생성
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.APPLICATION_SECRET }}" > src/main/resources/application-secret.yml

      - name: Gradle 권한 부여 및 빌드
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Docker Hub 로그인
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker 이미지 빌드 및 푸시
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/seatnow-app:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/seatnow-app:latest

      - name: 오라클 클라우드 VM 배포
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            # 기존 컨테이너 중지 및 삭제
            docker stop seatnow-app || true
            docker rm seatnow-app || true
            docker rmi ${{ secrets.DOCKER_USERNAME }}/seatnow-app:latest || true
            
            # 최신 이미지 풀 및 컨테이너 실행
            # (Dockerfile에 prod,secret 프로필이 설정되어 있으므로 환경변수 주입 최소화)
            docker pull ${{ secrets.DOCKER_USERNAME }}/seatnow-app:latest
            docker run -d -p 8080:8080 --name seatnow-app \
              -e PROD_DB_URL=${{ secrets.PROD_DB_URL }} \
              -e PROD_DB_USERNAME=${{ secrets.PROD_DB_USERNAME }} \
              -e PROD_DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }} \
              -e PROD_REDIS_HOST=${{ secrets.PROD_REDIS_HOST }} \
              -e PROD_REDIS_PORT=${{ secrets.PROD_REDIS_PORT }} \
              ${{ secrets.DOCKER_USERNAME }}/seatnow-app:latest