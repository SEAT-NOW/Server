name: Deploy to Amazon ECR and EC2

on:
  push:
    branches: [ "main" ] # main에 푸시되면 실행

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create application-secret.yml
        run: |
          mkdir -p ./src/main/resources
          # 따옴표로 감싸지 말고 'EOF' 방식을 쓰면 줄바꿈이 완벽하게 보존됨
          cat <<EOF > ./src/main/resources/application-secret.yml
          ${{ secrets.APPLICATION_SECRET_YML }}
          EOF

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: seatnow
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # EC2에 접속해서 최신 이미지를 실행시키는 부분
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker login -u AWS -p $(aws ecr get-login-password --region ap-northeast-2) 573499277225.dkr.ecr.ap-northeast-2.amazonaws.com
            docker pull 573499277225.dkr.ecr.ap-northeast-2.amazonaws.com/seatnow:latest
            docker stop seatnow-api || true
            docker rm seatnow-api || true
            docker run -d -p 8080:8080 --name seatnow-api --link seatnow-redis:redis -e SPRING_DATA_REDIS_HOST=redis 573499277225.dkr.ecr.ap-northeast-2.amazonaws.com/seatnow:latest